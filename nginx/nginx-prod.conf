# Прод (VPS, статический IP). TLS — Let's Encrypt (certbot, DNS-01).
# Сертификаты лежат в /etc/letsencrypt (примонтировано в контейнер nginx).

# Дефолтного размера корзины (32) не хватило, как только добавился третий
# server_name — admin.split-the-bill.uz. nginx на этом не деградирует, а
# отказывается стартовать целиком, унося с собой и основной домен.
server_names_hash_bucket_size 64;

server {
    listen 80;
    listen [::]:80;
    server_name split-the-bill.uz www.split-the-bill.uz;
    # весь HTTP → HTTPS
    return 301 https://split-the-bill.uz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name split-the-bill.uz www.split-the-bill.uz;

    ssl_certificate     /etc/letsencrypt/live/split-the-bill.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/split-the-bill.uz/privkey.pem;

    client_max_body_size 20M;

    # Telegram Web держит мини-апп во фрейме на web.telegram.org, и X-Frame-Options
    # его резал — клиент показывал «сайт не разрешает подключение». frame-ancestors
    # закрывает ту же дыру адресно: фреймить нас может только Telegram.
    add_header Content-Security-Policy "frame-ancestors https://web.telegram.org https://webk.telegram.org https://webz.telegram.org" always;
    add_header X-Content-Type-Options "nosniff";
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Backend API
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (события счёта, статус парсинга чека)
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Frontend (Next.js standalone)
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Иммутабельные ассеты Next.js
        location /_next/static/ {
            proxy_pass http://frontend:3000;
            expires 365d;
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Прочая статика
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }
}

# --- Админка ---------------------------------------------------------------
# Отдельный сабдомен, статика из общего volume (её кладёт туда контейнер admin
# и завершается). Отдельный Node-процесс не поднимается — на 2 ГБ он лишний.
server {
    listen 80;
    listen [::]:80;
    server_name admin.split-the-bill.uz;
    return 301 https://admin.split-the-bill.uz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.split-the-bill.uz;
    # Broadcast pictures straight off a phone; nginx's 1 MB default refused them.
    client_max_body_size 20M;

    ssl_certificate     /etc/letsencrypt/live/admin.split-the-bill.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.split-the-bill.uz/privkey.pem;

    add_header X-Frame-Options "DENY";
    add_header X-Content-Type-Options "nosniff";
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    root /var/www/admin;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }
}
