# Окружения / профили:
#   local — разработка на машине разработчика (hot-reload, TG-mock, локальный Postgres-контейнер)
#   dev   — тестовый стенд на мини-ПК (собранные образы, cloudflared-туннель, тест-бот, внешняя БД)
#   prod  — VPS со статическим IP: см. отдельный docker-compose.prod.yml (образы из GHCR, TLS, без туннеля)
x-common-config: &common-config
  restart: always
  networks:
    - app-network
  env_file: .env

services:
  # ── local ────────────────────────────────────────────────────────────────
  backend-local:
    <<: *common-config
    networks:
      app-network:
        aliases: [ "backend" ]
    build:
      context: ./backend
    profiles: [ "local" ]
    environment:
      - DB_HOST=${DB_HOST:-db}
    volumes:
      - ./backend:/app
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload" ]
    depends_on:
      db:
        condition: service_healthy

  frontend-local:
    <<: *common-config
    networks:
      app-network:
        aliases: [ "frontend" ]
    build:
      context: ./frontend
      target: deps
      args: &fe-args
        ENV: ${ENV:-development}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME}
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://eu.i.posthog.com}
        NEXT_PUBLIC_POSTHOG_DISABLE_REPLAY: ${NEXT_PUBLIC_POSTHOG_DISABLE_REPLAY:-}
    profiles: [ "local" ]
    environment:
      <<: *fe-args
      WATCHPACK_POLLING: "true"
      # Local-only: ставит фейковый window.Telegram.WebApp, чтобы приложение
      # работало в обычном браузере. frontend-dev этого НЕ получает.
      NEXT_PUBLIC_ENABLE_TG_MOCK: "1"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend-local
    command: npm run dev

  db:
    <<: *common-config
    image: postgres:17-alpine
    profiles: [ "local" ]
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_DB: ${DB_NAME:-split_the_bill_db}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ── dev (мини-ПК, cloudflared, тест-бот) ──────────────────────────────────
  backend-dev:
    <<: *common-config
    networks:
      app-network:
        aliases: [ "backend" ]
    build: ./backend
    profiles: [ "dev" ]
    environment:
      - DB_HOST=${DB_HOST:-db}
    # Сохраняем загруженные фото чеков (STORAGE_DIR=/app/storage) между
    # пересозданиями контейнера.
    volumes:
      - backend_storage:/app/storage

  frontend-dev:
    <<: *common-config
    networks:
      app-network:
        aliases: [ "frontend" ]
    build:
      context: ./frontend
      args:
        <<: *fe-args
        ENV: ${ENV:-production}
    profiles: [ "dev" ]
    environment:
      <<: *fe-args
      ENV: ${ENV:-production}
    depends_on:
      - backend-dev

  # Builds the admin SPA and publishes it into the nginx-served volume for the
  # Cloudflare-backed dev host admin-dev.split-the-bill.uz.
  admin-dev:
    <<: *common-config
    build:
      context: ./admin
      args:
        NEXT_PUBLIC_ADMIN_API_URL: ${NEXT_PUBLIC_ADMIN_API_URL:-/api/admin}
    profiles: [ "dev" ]
    restart: "no"
    volumes:
      - admin_static:/var/www/admin

  # ── общие для local и dev ─────────────────────────────────────────────────
  nginx:
    <<: *common-config
    # Pinned to the stable line. `latest` follows mainline, so every deploy could
    # pull a new nginx and, on a bad day, one that refuses the config.
    image: nginx:1.30
    profiles: [ "local", "dev" ]
    volumes:
      - ./nginx/nginx-${NGINX_ENV:-development}.conf:/etc/nginx/conf.d/default.conf:ro
      - admin_static:/var/www/admin:ro
    ports:
      - "127.0.0.1:${NGINX_PORT:-80}:80"
    depends_on:
      backend-local: { condition: service_started, required: false }
      frontend-local: { condition: service_started, required: false }
      backend-dev: { condition: service_started, required: false }
      frontend-dev: { condition: service_started, required: false }
      admin-dev: { condition: service_completed_successfully, required: false }

  cloudflared:
    <<: *common-config
    image: cloudflare/cloudflared:latest
    profiles: [ "dev" ]
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    depends_on:
      - nginx

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  backend_storage:
  admin_static:
